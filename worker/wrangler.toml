name = "immersive-study"
main = "index.mjs"
compatibility_date = "2026-09-01"

# 배포 전:
#   npx wrangler login
#   npx wrangler kv namespace create STUDY_KV   → 아래 id 채우기
#   npx wrangler secret put OPENAI_API_KEY
#   npx wrangler deploy
# 배포 후 src/index.html 의 STUDY_ENDPOINT 를 https://immersive-study.<계정>.workers.dev/study 로 바꿈

[vars]
ALLOWED_ORIGIN = "*"
OPENAI_MODEL = "gpt-5.6-terra"

# [[kv_namespaces]]
# binding = "STUDY_KV"
# id = "여기에_KV_ID"
