<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>D3 손 추적 검증 — hand-cursor + pinch</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; }
    #hud { position: fixed; top: 8px; left: 8px; z-index: 10; background: rgba(0,0,0,.6); color: #fff;
           padding: 8px 10px; border-radius: 8px; font-size: 13px; line-height: 1.5; max-width: 360px; }
    #hud b { color: #9ef; }
    #log { margin-top: 6px; max-height: 120px; overflow: auto; font-family: ui-monospace, monospace; font-size: 11px; opacity: .85; }
    #cam { position: fixed; right: 8px; bottom: 8px; width: 200px; height: 150px; z-index: 10;
           transform: scaleX(-1); border-radius: 8px; background: #000; object-fit: cover; opacity: .85; }
    #btn { position: fixed; left: 8px; bottom: 8px; z-index: 10; padding: 8px 12px; font-size: 14px; }
  </style>
</head>
<body>
  <div id="hud">
    <div>상태: <b id="st">대기</b> · 손: <b id="hand">없음</b> · 핀치: <b id="pinch">아니오</b> · FPS: <b id="fps">-</b></div>
    <div>입력: <b id="mode">마우스(폴백)</b> · 핀치 거리: <b id="dist">-</b></div>
    <div>검증: 손을 들어 구를 가리키고 엄지·검지를 붙였다 떼세요. 구가 켜지면 성공.</div>
    <div id="log"></div>
  </div>
  <button id="btn">카메라 시작</button>
  <video id="cam" autoplay playsinline muted></video>

  <a-scene background="color: #0b0f1a" renderer="antialias: true" vr-mode-ui="enabled: false"
           device-orientation-permission-ui="enabled: false" hand-cursor>
    <a-entity id="camera" camera="fov: 70" position="0 1.6 0" look-controls="enabled: false">
      <!-- 커서: 카메라 자식. 화면 정규화 좌표를 카메라 앞 평면(z=-1.5)에 투영 -->
      <a-entity id="cursor" position="0 0 -1.5">
        <a-ring radius-inner="0.02" radius-outer="0.035" color="#9ef" material="shader: flat"></a-ring>
        <a-sphere id="cursor-dot" radius="0.008" color="#fff" material="shader: flat"></a-sphere>
      </a-entity>
    </a-entity>

    <!-- 손 커서 방향으로 쏘는 raycaster. 월드 좌표 사용 -->
    <a-entity id="ray" raycaster="objects: .target; useWorldCoordinates: true; far: 20; interval: 0"></a-entity>

    <!-- 검증 대상: 3x4 구 격자 -->
    <a-entity id="targets" position="0 1.6 -3"></a-entity>

    <a-plane position="0 0 -3" rotation="-90 0 0" width="12" height="12" color="#141a2b"></a-plane>
    <a-entity light="type: ambient; intensity: 0.6"></a-entity>
    <a-entity light="type: directional; intensity: 0.7" position="1 3 2"></a-entity>
  </a-scene>

  <script>
    // ---------- 공통 HUD ----------
    const $ = (id) => document.getElementById(id);
    const logEl = $("log");
    function log(msg) {
      const t = new Date().toLocaleTimeString("ko-KR", { hour12: false });
      logEl.insertAdjacentHTML("afterbegin", `<div>${t} ${msg}</div>`);
      while (logEl.children.length > 40) logEl.lastChild.remove();
    }

    // ---------- 대상 생성 ----------
    const targetsEl = $("targets");
    const counts = {};
    let n = 0;
    for (let r = 0; r < 3; r++) for (let c = 0; c < 4; c++) {
      const s = document.createElement("a-sphere");
      const id = `t${n++}`;
      s.setAttribute("id", id);
      s.classList.add("target");
      s.setAttribute("radius", "0.22");
      s.setAttribute("color", "#3b4a6b");
      s.setAttribute("position", `${(c - 1.5) * 0.8} ${(1 - r) * 0.7} 0`);
      s.setAttribute("target-fx", "");
      targetsEl.appendChild(s);
      counts[id] = 0;
    }

    // hover / pinch 반응
    AFRAME.registerComponent("target-fx", {
      init() {
        const el = this.el;
        el.addEventListener("raycaster-intersected", () => { if (!el.dataset.on) el.setAttribute("color", "#6a8bd6"); });
        el.addEventListener("raycaster-intersected-cleared", () => { if (!el.dataset.on) el.setAttribute("color", "#3b4a6b"); });
        el.addEventListener("pinchstart", () => {
          el.dataset.on = el.dataset.on ? "" : "1";
          el.setAttribute("color", el.dataset.on ? "#ffd166" : "#6a8bd6");
          el.setAttribute("scale", el.dataset.on ? "1.25 1.25 1.25" : "1 1 1");
          counts[el.id]++;
          log(`pinch on <b>${el.id}</b> (${counts[el.id]}회)`);
        });
      }
    });

    // ---------- hand-cursor: 정규화 좌표(0~1) → 카메라 앞 커서 → raycaster ----------
    AFRAME.registerComponent("hand-cursor", {
      schema: { smooth: { default: 5 }, pinchStart: { default: 0.25 }, pinchEnd: { default: 0.40 }, dist: { default: 1.5 } },
      init() {
        this.buf = [];
        this.target = null;          // 현재 교차 대상
        this.pinching = false;
        this.hasHand = false;
        this.lastHandTs = 0;
        this.mode = "mouse";
        this.camEl = $("camera");
        this.cursorEl = $("cursor");
        this.rayEl = $("ray");
        this.origin = new THREE.Vector3();
        this.dir = new THREE.Vector3();
        this.cursorWorld = new THREE.Vector3();

        this.rayEl.addEventListener("raycaster-intersection", (e) => { this.target = e.detail.els[0] ?? null; });
        this.rayEl.addEventListener("raycaster-intersection-cleared", () => { this.target = null; });

        // 마우스 폴백
        window.addEventListener("mousemove", (e) => {
          if (this.mode !== "mouse") return;
          this.setNorm(e.clientX / innerWidth, e.clientY / innerHeight);
        });
        window.addEventListener("mousedown", (e) => { if (this.mode === "mouse" && !e.target.closest("#hud,#btn")) this.setPinch(true, 0); });
        window.addEventListener("mouseup", () => { if (this.mode === "mouse") this.setPinch(false, 1); });
      },
      // x,y: 0~1 화면 정규화 (0,0 = 좌상단)
      setNorm(x, y) {
        this.buf.push([x, y]);
        if (this.buf.length > this.data.smooth) this.buf.shift();
        const ax = this.buf.reduce((s, p) => s + p[0], 0) / this.buf.length;
        const ay = this.buf.reduce((s, p) => s + p[1], 0) / this.buf.length;
        const cam = this.camEl.getObject3D("camera");
        const d = this.data.dist;
        const hh = d * Math.tan(THREE.MathUtils.degToRad(cam.fov) / 2);
        const hw = hh * cam.aspect;
        this.cursorEl.object3D.position.set((ax * 2 - 1) * hw, (1 - ay * 2) * hh, -d);
      },
      setPinch(on, ratio) {
        if (on === this.pinching) return;
        this.pinching = on;
        $("pinch").textContent = on ? "예" : "아니오";
        if (on) {
          if (this.target) this.target.emit("pinchstart");
          else log(`pinchstart (대상 없음, 비율 ${ratio.toFixed(2)})`);
        } else if (this.target) this.target.emit("pinchend");
      },
      // MediaPipe 결과 입력. landmarks: 21개 {x,y,z} (0~1), 거울 모드 고려해 x 반전
      feedHand(lm, ts) {
        this.lastHandTs = ts;
        if (!this.hasHand) { this.hasHand = true; $("hand").textContent = "감지"; }
        if (this.mode !== "hand") { this.mode = "hand"; $("mode").textContent = "손 추적"; log("입력 전환 → 손"); }
        const tip = lm[8], thumb = lm[4], wrist = lm[0], midMcp = lm[9];
        this.setNorm(1 - tip.x, tip.y);
        const handSize = Math.hypot(wrist.x - midMcp.x, wrist.y - midMcp.y) || 1e-6;
        const ratio = Math.hypot(tip.x - thumb.x, tip.y - thumb.y) / handSize;
        $("dist").textContent = ratio.toFixed(2);
        if (!this.pinching && ratio < this.data.pinchStart) this.setPinch(true, ratio);
        else if (this.pinching && ratio > this.data.pinchEnd) this.setPinch(false, ratio);
      },
      tick(t) {
        // 손이 1초 이상 안 보이면 마우스로 복귀
        if (this.mode === "hand" && t - this.lastHandTs > 1000) {
          this.mode = "mouse"; this.hasHand = false;
          $("mode").textContent = "마우스(폴백)"; $("hand").textContent = "없음";
          this.setPinch(false, 1);
          log("손 놓침 → 마우스 폴백");
        }
        // 카메라 위치 → 커서 월드 위치 방향으로 raycast
        this.camEl.object3D.getWorldPosition(this.origin);
        this.cursorEl.object3D.getWorldPosition(this.cursorWorld);
        this.dir.copy(this.cursorWorld).sub(this.origin).normalize();
        this.rayEl.setAttribute("raycaster", { origin: this.origin, direction: this.dir });
      }
    });

    // ---------- MediaPipe Hand Landmarker ----------
    const MP_VER = "1.0.1"; // 2026-09-21 npm latest. 시연 전 재확인
    let starting = false;
    $("btn").addEventListener("click", () => { if (!starting) startHand(); });

    async function startHand() {
      const sceneEl = document.querySelector("a-scene");
      const hc = () => sceneEl.components["hand-cursor"];
      starting = true;
      $("st").textContent = "모델 로딩";
      try {
        const { HandLandmarker, FilesetResolver } = await import(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VER}/vision_bundle.mjs`);
        const vision = await FilesetResolver.forVisionTasks(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VER}/wasm`);
        const landmarker = await HandLandmarker.createFromOptions(vision, {
          baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task", delegate: "GPU" },
          runningMode: "VIDEO", numHands: 1,
        });
        $("st").textContent = "카메라 요청";
        const video = $("cam");
        video.srcObject = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480, facingMode: "user" } });
        await new Promise((r) => (video.onloadeddata = r));
        $("st").textContent = "추적 중";
        $("btn").remove();
        log(`MediaPipe ${MP_VER} 시작, ${video.videoWidth}x${video.videoHeight}`);

        let last = -1, frames = 0, fpsT = performance.now();
        const loop = () => {
          const now = performance.now();
          if (video.currentTime !== last) {
            last = video.currentTime;
            const res = landmarker.detectForVideo(video, now);
            if (res.landmarks && res.landmarks.length) hc().feedHand(res.landmarks[0], now);
            frames++;
            if (now - fpsT > 1000) { $("fps").textContent = frames; frames = 0; fpsT = now; }
          }
          requestAnimationFrame(loop);
        };
        loop();
      } catch (e) {
        starting = false;
        $("st").textContent = "실패 → 마우스 폴백 (버튼으로 재시도)";
        log(`손 추적 시작 실패: ${e.name}: ${e.message}`);
        console.error(e);
      }
    }
  </script>
</body>
</html>
