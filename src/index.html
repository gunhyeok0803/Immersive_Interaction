<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>손으로 펼치는 연구실 논문 지도</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  <script src="js/hand-cursor.js"></script>
  <script src="js/paper-field.js"></script>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ui { position: fixed; z-index: 10; color: #e6f1ff; }
    .box { background: rgba(10,14,26,.72); border: 1px solid #22304f; border-radius: 10px; padding: 8px 12px; font-size: 13px; line-height: 1.5; }
    #top { top: 10px; left: 10px; max-width: 480px; }
    #top b { color: #9ef; }
    #hint { bottom: 12px; left: 50%; transform: translateX(-50%); white-space: nowrap; }
    #btn { left: 10px; bottom: 10px; padding: 8px 14px; font-size: 14px; border-radius: 8px; border: 0; background: #9ef; color: #0b0f1a; cursor: pointer; }
    #cam { right: 10px; bottom: 10px; width: 160px; height: 120px; transform: scaleX(-1); border-radius: 8px; background: #000; object-fit: cover; opacity: .8; }
    /* 진단 HUD: 인식 문제 vs 조준 문제를 가르기 위한 것 */
    #dbg { left: 10px; bottom: 56px; width: 330px; font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; }
    #dbg .bar { height: 6px; background: #22304f; border-radius: 3px; margin: 4px 0; position: relative; }
    #dbg .bar i { position: absolute; left: 0; top: 0; bottom: 0; background: #9ef; border-radius: 3px; }
    #dbg .bar s { position: absolute; top: -3px; bottom: -3px; width: 2px; background: #ffd166; }
    #dbg .log { margin-top: 6px; max-height: 110px; overflow: auto; opacity: .9; }
    #preview { right: 10px; top: 60px; width: 380px; max-height: 70vh; overflow: auto; display: none; }
    #preview h2 { font-size: 15px; margin: 0 0 6px; color: #ffd166; }
    #preview .meta { color: #8892b0; margin-bottom: 8px; }
    #preview a { color: #9ef; }
  </style>
</head>
<body>
  <div id="top" class="ui box">
    <div><b id="author">불러오는 중…</b> <span id="count"></span></div>
    <div>입력: <b id="mode">마우스(폴백)</b> · FPS: <b id="fps">-</b> · <span id="status">카메라 대기</span></div>
    <div id="hoverTitle" style="color:#ffd166; min-height:1.4em"></div>
  </div>
  <div id="hint" class="ui box">손을 들어 논문을 가리키고, 엄지·검지를 붙여 집은 뒤 당겨서 놓으세요 · 다시 집으면 닫힘</div>
  <button id="btn" class="ui">카메라 시작</button>
  <video id="cam" class="ui" autoplay playsinline muted></video>

  <div id="dbg" class="ui box">
    <div>핀치 비율 <b id="dRatio">-</b> · 상태 <b id="dPinch">-</b> · 레이 <b id="dRay">-</b></div>
    <div class="bar"><i id="dBar" style="width:0"></i><s id="dS1"></s><s id="dS2"></s></div>
    <div>대상: <span id="dTarget" style="color:#ffd166">-</span></div>
    <div class="log" id="dLog"></div>
  </div>

  <div id="preview" class="ui box">
    <h2 id="pTitle"></h2>
    <div class="meta" id="pMeta"></div>
    <div id="pAbstract"></div>
    <div style="margin-top:8px"><a id="pLink" target="_blank" rel="noopener">원문 (DOI)</a></div>
    <div style="margin-top:8px; color:#8892b0">노드를 다시 핀치하면 닫힙니다</div>
  </div>

  <a-scene background="color: #0b0f1a" renderer="antialias: true" vr-mode-ui="enabled: false"
           device-orientation-permission-ui="enabled: false"
           hand-cursor="pointer: pinch; pinchStart: 0.28; pinchEnd: 0.45; graceMs: 300">
    <a-entity id="camera" camera="fov: 70" position="0 1.6 0" look-controls="enabled: false" wasd-controls="enabled: false">
      <a-entity id="cursor" position="0 0 -1.5">
        <a-ring id="cursor-ring" radius-inner="0.022" radius-outer="0.04" color="#9ef" material="shader: flat; opacity: 0.95; transparent: true"></a-ring>
        <a-sphere radius="0.007" color="#fff" material="shader: flat"></a-sphere>
      </a-entity>
    </a-entity>
    <a-entity id="ray" raycaster="objects: .target; useWorldCoordinates: true; far: 20; interval: 0"></a-entity>

    <a-entity id="field" paper-field="src: data/papers.json; depth: -3.5"></a-entity>

    <a-plane position="0 -1.7 -4" rotation="-90 0 0" width="16" height="12" color="#121828"></a-plane>
    <a-entity light="type: ambient; intensity: 0.6"></a-entity>
    <a-entity light="type: directional; intensity: 0.8" position="1 3 2"></a-entity>
  </a-scene>

  <script>
    const $ = (id) => document.getElementById(id);
    const scene = document.querySelector("a-scene");
    const dlog = (msg) => {
      const t = new Date().toLocaleTimeString("ko-KR", { hour12: false });
      $("dLog").insertAdjacentHTML("afterbegin", `<div>${t} ${msg}</div>`);
      while ($("dLog").children.length > 30) $("dLog").lastChild.remove();
    };

    scene.addEventListener("papers-loaded", (e) => {
      $("author").textContent = e.detail.author?.name || "저자 미상";
      $("count").textContent = `논문 ${e.detail.count}편 · ${new URL(e.detail.source).host}`;
    });
    scene.addEventListener("paper-hover", (e) => { $("hoverTitle").textContent = e.detail.paper?.title ?? ""; });
    scene.addEventListener("paper-unhover", () => { $("hoverTitle").textContent = ""; });
    scene.addEventListener("hand-cursor-mode", (e) => {
      $("mode").textContent = e.detail.mode === "hand" ? "손 추적" : "마우스(폴백)";
      dlog(`입력 → ${e.detail.mode}`);
    });
    scene.addEventListener("paper-grab", (e) => dlog(`집음: ${e.detail.paper.title.slice(0, 40)}`));
    scene.addEventListener("paper-open", (e) => {
      const p = e.detail.paper;
      dlog(`열림: ${p.title.slice(0, 40)}`);
      $("pTitle").textContent = p.title;
      $("pMeta").textContent = `${p.year ?? "-"} · ${p.venue || "-"} · 피인용 ${p.cited}` + (p.is_oa ? " · 오픈액세스" : "");
      $("pAbstract").textContent = p.abstract || "(OpenAlex에 초록 없음)";
      $("pLink").href = p.url || "#";
      $("preview").style.display = "block";
    });
    scene.addEventListener("paper-close", (e) => { dlog(`닫힘/복귀: ${e.detail.paper.title.slice(0, 40)}`); $("preview").style.display = "none"; });
    scene.addEventListener("pinch-empty", (e) => dlog(`핀치했지만 대상 없음 (비율 ${e.detail.ratio.toFixed(2)})`));

    // 진단 HUD
    const hc = () => scene.components["hand-cursor"];
    scene.addEventListener("hand-cursor-debug", (e) => {
      const d = e.detail, c = hc();
      $("dRatio").textContent = d.mode === "hand" ? d.ratio.toFixed(2) : "(마우스)";
      $("dPinch").textContent = d.pinching ? "핀치 중" : "열림";
      $("dRay").textContent = d.rayHit ? "맞음" : "-";
      $("dTarget").textContent = d.target ? d.target.slice(0, 48) : "-";
      if (c && d.mode === "hand") {
        const w = Math.min(100, d.ratio / 0.8 * 100);
        $("dBar").style.width = w + "%";
        $("dS1").style.left = (c.data.pinchStart / 0.8 * 100) + "%";
        $("dS2").style.left = (c.data.pinchEnd / 0.8 * 100) + "%";
      }
    });

    let starting = false;
    $("btn").addEventListener("click", async () => {
      if (starting) return;
      starting = true;
      $("status").textContent = "모델 로딩…";
      try {
        await startHandTracking({ videoEl: $("cam"), sceneEl: scene, onFps: (f) => ($("fps").textContent = f) });
        $("status").textContent = "손 추적 중";
        $("btn").remove();
        dlog("MediaPipe 시작");
      } catch (err) {
        starting = false;
        $("status").textContent = `실패(${err.name}) → 마우스로 계속`;
        dlog(`카메라 실패: ${err.name}`);
        console.error(err);
      }
    });
  </script>
</body>
</html>
